[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiovista-ai"
version = "0.1.0"
description = "Explainable four-target coronary disease prediction"
requires-python = ">=3.11,<3.13"
dependencies = ["pandas>=2.2,<4", "numpy>=1.26,<3", "openpyxl>=3.1,<4", "scikit-learn>=1.7,<2", "catboost>=1.2,<2", "matplotlib>=3.9,<4", "joblib>=1.4,<2", "fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
cardiovista = "cardio_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
